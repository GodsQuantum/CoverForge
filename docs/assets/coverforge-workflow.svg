<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CoverForge workflow</title>
  <desc id="desc">Image to Smart crop to Brand kit to Dynamic layers to Multi-format to ZIP or API.</desc>
  <defs>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#FF4D00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#FF7A00"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#FFF8F1"/>
  <g transform="translate(42 34)">
    <g fill="none" stroke="url(#forge)" stroke-width="5" stroke-linecap="round">
      <path d="M0 27V8a8 8 0 0 1 8-8h19"/><path d="M82 0h19a8 8 0 0 1 8 8v19"/>
      <path d="M109 82v19a8 8 0 0 1-8 8H82"/><path d="M27 109H8a8 8 0 0 1-8-8V82"/>
    </g>
    <rect x="32" y="26" width="58" height="70" rx="10" fill="url(#forge)" opacity=".22"/>
    <rect x="18" y="14" width="62" height="76" rx="11" fill="#FFC64D" stroke="#FF7A00" stroke-width="4"/>
    <circle cx="37" cy="36" r="7" fill="#FFF8F1"/>
    <path d="M18 69c11-12 19-18 28-18 10 0 20 7 34 23v16H18z" fill="#FF4D00" opacity=".82"/>
  </g>
  <text x="174" y="85" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800"><tspan fill="#111827">Cover</tspan><tspan fill="#FF7A00">Forge</tspan></text>
  <text x="174" y="119" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">One image, every format.</text>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g filter="url(#shadow)"><rect x="46" y="190" width="145" height="104" rx="18" fill="#fff"/><text x="118" y="235" font-size="20" font-weight="700" fill="#111827">Image</text><text x="118" y="263" font-size="14" fill="#64748b">JPEG · PNG · WebP</text></g>
    <g filter="url(#shadow)"><rect x="239" y="190" width="145" height="104" rx="18" fill="#fff"/><text x="311" y="235" font-size="20" font-weight="700" fill="#111827">Smart crop</text><text x="311" y="263" font-size="14" fill="#64748b">Reframe once</text></g>
    <g filter="url(#shadow)"><rect x="432" y="190" width="145" height="104" rx="18" fill="#fff"/><text x="504" y="235" font-size="20" font-weight="700" fill="#111827">Brand kit</text><text x="504" y="263" font-size="14" fill="#64748b">Logo · palette · type</text></g>
    <g filter="url(#shadow)"><rect x="625" y="190" width="145" height="104" rx="18" fill="#fff"/><text x="697" y="235" font-size="20" font-weight="700" fill="#111827">Dynamic layers</text><text x="697" y="263" font-size="14" fill="#64748b">Title · badge · media</text></g>
    <g filter="url(#shadow)"><rect x="818" y="190" width="145" height="104" rx="18" fill="#fff"/><text x="890" y="235" font-size="20" font-weight="700" fill="#111827">Multi-format</text><text x="890" y="263" font-size="14" fill="#64748b">16:9 · 1:1 · 4:5 · 9:16</text></g>
    <g filter="url(#shadow)"><rect x="1011" y="190" width="145" height="104" rx="18" fill="url(#forge)"/><text x="1083" y="235" font-size="20" font-weight="800" fill="#fff">ZIP / API</text><text x="1083" y="263" font-size="14" fill="#FFF8F1">Export or automate</text></g>
  </g>
  <g fill="none" stroke="#FF7A00" stroke-width="4" marker-end="url(#arrow)">
    <path d="M199 242H229"/><path d="M392 242H422"/><path d="M585 242H615"/><path d="M778 242H808"/><path d="M971 242H1001"/>
  </g>
</svg>
