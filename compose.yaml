name: coverforge
services:
  coverforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: coverforge:0.6.1
    container_name: coverforge
    restart: unless-stopped
    user: 1000:1000
    ports:
    - ${COVERFORGE_BIND_HOST:-127.0.0.1}:${COVERFORGE_PORT:-3099}:3099
    environment:
      HOME: /tmp/coverforge-home
      XDG_CACHE_HOME: /tmp/coverforge-cache
      COVERFORGE_BIND: 0.0.0.0:3099
      COVERFORGE_TEMPLATE_DIR: /data/templates
      COVERFORGE_DEFAULT_TEMPLATE_DIR: /app/default-templates
      COVERFORGE_OUTPUT_DIR: /data/output
      COVERFORGE_ASSET_ROOTS: /data/assets
      COVERFORGE_FONT_DIR: /usr/local/share/fonts/coverforge-custom
      RUST_LOG: coverforge=info,tower_http=warn
    volumes:
    - ${COVERFORGE_ASSETS_HOST_DIR:-./data/assets}:/data/assets:ro
    - ${COVERFORGE_OUTPUT_HOST_DIR:-./data/output}:/data/output
    - ${COVERFORGE_TEMPLATES_HOST_DIR:-./data/templates}:/data/templates
    - ${COVERFORGE_FONTS_HOST_DIR:-./data/fonts}:/usr/local/share/fonts/coverforge-custom:ro
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 192
    cpus: 2.0
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3099/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
